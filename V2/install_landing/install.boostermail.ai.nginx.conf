server {
    listen 80;
    listen [::]:80;
    server_name install.boostermail.ai;

    root /var/www/install.boostermail.ai;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache des assets statiques (1 an)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML : cache court (1h) pour permettre des updates rapides
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Logs dédiés
    access_log /var/log/nginx/install.boostermail.ai.access.log;
    error_log  /var/log/nginx/install.boostermail.ai.error.log;
}
