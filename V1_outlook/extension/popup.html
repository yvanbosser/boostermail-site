<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>BoosterMail</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        width: 280px;
        padding: 16px;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 13px;
        color: #333;
    }
    h1 {
        font-size: 15px;
        font-weight: 600;
        color: #0F6CBD;
        margin-bottom: 8px;
    }
    .status {
        padding: 8px 12px;
        background: #f0f7ff;
        border-left: 3px solid #0F6CBD;
        border-radius: 3px;
        font-size: 12px;
        color: #555;
        margin-bottom: 12px;
    }
    .hint {
        font-size: 11px;
        color: #888;
        line-height: 1.4;
    }
    a { color: #0F6CBD; text-decoration: none; }
    a:hover { text-decoration: underline; }
</style>
</head>
<body>
    <h1>✉ BoosterMail</h1>
    <div class="status" id="status">Extension active</div>
    <div class="hint">
        Cette extension permet à BoosterMail de s'intégrer à Outlook Web sans déclencher
        les popups de confirmation Microsoft. Elle est automatique — aucune action requise.
    </div>
</body>
</html>
