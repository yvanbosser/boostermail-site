<!DOCTYPE html>
<html lang="{{ lang_code }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  {% block meta_tags %}{% endblock %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#060914;
      --bg2:#0d1424;
      --card:rgba(255,255,255,0.04);
      --border:rgba(255,255,255,0.08);
      --primary:#6366f1;
      --pl:#818cf8;
      --violet:#8b5cf6;
      --cyan:#06b6d4;
      --green:#10b981;
      --text:#f1f5f9;
      --muted:#94a3b8;
      --faint:#475569;
      --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#06b6d4 100%)
    }
    html.light-mode {
      --bg:#f5f5f7;
      --bg2:#ffffff;
      --card:rgba(0,0,0,0.05);
      --border:rgba(0,0,0,0.12);
      --text:#0f0f1e;
      --muted:#5a5a7a;
      --faint:#d0d0e0;
    }
    * { margin:0; padding:0; box-sizing:border-box }
    html { scroll-behavior:smooth }
    body { font-family:'Inter',-apple-system,sans-serif; color:var(--text); background:var(--bg); overflow-x:hidden; transition:background .3s, color .3s }
    nav { position:fixed; top:0; width:100%; z-index:100; padding:20px 48px; display:flex; align-items:center; justify-content:space-between; background:rgba(6,9,20,.95); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); transition:background .3s, border-color .3s }
    html.light-mode nav { background:rgba(255,255,255,.98); border-bottom-color:#e0e0e8 }
    html.light-mode .nav-links a { color:#5a5a7a }
    html.light-mode .nav-links a:hover { color:#0f0f1e }
    html.light-mode .nav-cta { box-shadow:0 0 15px rgba(99,102,241,0.2)!important }
    .nav-logo { font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:700; text-decoration:none; display:flex; align-items:center; gap:9px; background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text }
    .nav-links { display:flex; gap:28px; align-items:center }
    .nav-links a { text-decoration:none; color:var(--muted); font-size:14px; font-weight:500; transition:color .2s }
    .nav-links a:hover { color:var(--text) }
    .theme-toggle { background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; transition:all .3s; padding:0; width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:6px }
    .theme-toggle:hover { color:var(--text); background:rgba(99,102,241,0.1) }
    .theme-toggle:active { transform:scale(0.95) }
    .nav-cta { background:var(--grad)!important; color:white!important; padding:9px 22px; border-radius:8px; font-weight:600!important; box-shadow:0 0 20px rgba(99,102,241,.3); transition:all .3s!important }
    footer { padding:36px 48px; border-top:1px solid var(--border); text-align:center; font-size:12px; color:var(--muted); transition:border-color .3s }
    @media(max-width:768px) {
      nav { padding:14px 20px }
      footer { padding:20px }
      .nav-links { gap:16px }
    }
  </style>

  {% block extra_styles %}{% endblock %}
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">⚡ BoosterMail</a>
  <div class="nav-links">
    <a href="index.html#features">{{ nav.features }}</a>
    <a href="index.html#pricing">{{ nav.pricing }}</a>
    <a href="blog{{ '-' + lang_code if lang_code != 'fr' else '' }}.html" style="color:var(--pl)">{{ nav.blog }}</a>
    <button id="themeToggle" class="theme-toggle" title="Toggle dark/light mode">🌙</button>
    <a href="index.html#waitlist" class="nav-cta">{{ nav.cta }}</a>
  </div>
</nav>

<script>
  // Initialize theme on page load
  document.addEventListener('DOMContentLoaded', function() {
    const savedTheme = localStorage.getItem('theme') || 'dark';
    const html = document.documentElement;
    const themeBtn = document.getElementById('themeToggle');

    // Apply saved theme
    if (savedTheme === 'light') {
      html.classList.add('light-mode');
      themeBtn.textContent = '🌙';
    } else {
      html.classList.remove('light-mode');
      themeBtn.textContent = '☀️';
    }

    // Toggle theme on button click
    themeBtn.addEventListener('click', function() {
      const isLight = html.classList.contains('light-mode');

      if (isLight) {
        html.classList.remove('light-mode');
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '☀️';
      } else {
        html.classList.add('light-mode');
        localStorage.setItem('theme', 'light');
        themeBtn.textContent = '🌙';
      }
    });
  });
</script>

{% block content %}{% endblock %}

<footer>
  <p>{{ footer.copyright }}</p>
  <div style="margin-top:12px; font-size:11px">
    <a href="#privacy" style="color:var(--muted); text-decoration:none; margin:0 12px">{{ footer.privacy }}</a>
    <a href="#terms" style="color:var(--muted); text-decoration:none; margin:0 12px">{{ footer.terms }}</a>
  </div>
</footer>

</body>
</html>
