<!DOCTYPE html>
<html lang="{{ lang_code }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  {% block meta_tags %}{% endblock %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#060914;
      --bg2:#0d1424;
      --card:rgba(255,255,255,0.04);
      --border:rgba(255,255,255,0.08);
      --primary:#6366f1;
      --pl:#818cf8;
      --violet:#8b5cf6;
      --cyan:#06b6d4;
      --green:#10b981;
      --text:#f1f5f9;
      --muted:#94a3b8;
      --faint:#475569;
      --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#06b6d4 100%)
    }
    * { margin:0; padding:0; box-sizing:border-box }
    html { scroll-behavior:smooth }
    body { font-family:'Inter',-apple-system,sans-serif; color:var(--text); background:var(--bg); overflow-x:hidden }
    nav { position:fixed; top:0; width:100%; z-index:100; padding:20px 48px; display:flex; align-items:center; justify-content:space-between; background:rgba(6,9,20,.95); backdrop-filter:blur(20px); border-bottom:1px solid var(--border) }
    .nav-logo { font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:700; text-decoration:none; display:flex; align-items:center; gap:9px; background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text }
    .nav-links { display:flex; gap:28px; align-items:center }
    .nav-links a { text-decoration:none; color:var(--muted); font-size:14px; font-weight:500; transition:color .2s }
    .nav-links a:hover { color:var(--text) }
    .nav-cta { background:var(--grad)!important; color:white!important; padding:9px 22px; border-radius:8px; font-weight:600!important; box-shadow:0 0 20px rgba(99,102,241,.3); transition:all .3s!important }
    footer { padding:36px 48px; border-top:1px solid var(--border); text-align:center; font-size:12px; color:var(--muted) }
    @media(max-width:768px) {
      nav { padding:14px 20px }
      footer { padding:20px }
    }
  </style>

  {% block extra_styles %}{% endblock %}
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">⚡ BoosterMail</a>
  <div class="nav-links">
    <a href="index.html#features">{{ nav.features }}</a>
    <a href="index.html#pricing">{{ nav.pricing }}</a>
    <a href="blog{{ '-' + lang_code if lang_code != 'fr' else '' }}.html" style="color:var(--pl)">{{ nav.blog }}</a>
    <a href="index.html#waitlist" class="nav-cta">{{ nav.cta }}</a>
  </div>
</nav>

{% block content %}{% endblock %}

<footer>
  <p>{{ footer.copyright }}</p>
  <div style="margin-top:12px; font-size:11px">
    <a href="#privacy" style="color:var(--muted); text-decoration:none; margin:0 12px">{{ footer.privacy }}</a>
    <a href="#terms" style="color:var(--muted); text-decoration:none; margin:0 12px">{{ footer.terms }}</a>
  </div>
</footer>

</body>
</html>
